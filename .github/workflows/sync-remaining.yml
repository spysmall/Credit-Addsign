name: Auto Sync Remaining Credit

# The schedule is off: the site now needs a Google sign-in, which a headless browser cannot do.
# The Dashboard still auto-syncs on Fridays from 10:00 when a super admin opens it.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Trigger remaining-credit sync
        run: node scripts/sync-remaining.mjs
